<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="38" font-size="21" font-weight="700" fill="#0f172a">Larkspur Agent — one core, three channels, human-gated clinical risk</text>
  <text x="40" y="60" font-size="12" fill="#64748b">APPROACH.md · Section C diagram · Saguaro Family Medicine pilot · not to scale</text>

  <!-- ===================== CHANNELS ===================== -->
  <rect x="40" y="92" width="360" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="56" y="118" font-size="14" font-weight="700" fill="#312e81">Phone / voice</text>
  <text x="56" y="137" font-size="11.5" fill="#4338ca">Twilio Programmable Voice · SIP onto Saguaro lines</text>

  <rect x="420" y="92" width="360" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="436" y="118" font-size="14" font-weight="700" fill="#312e81">SMS / text</text>
  <text x="436" y="137" font-size="11.5" fill="#4338ca">Twilio · 10DLC / toll-free · text-native</text>

  <rect x="800" y="92" width="360" height="62" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="816" y="118" font-size="14" font-weight="700" fill="#312e81">Portal chat</text>
  <text x="816" y="137" font-size="11.5" fill="#4338ca">Embed / webhook · authenticated session</text>

  <!-- channels -> adapters -->
  <line x1="220" y1="154" x2="220" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="154" x2="600" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="980" y1="154" x2="980" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===================== ADAPTERS ===================== -->
  <rect x="40" y="178" width="1120" height="52" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="56" y="200" font-size="13" font-weight="700" fill="#334155">Channel adapters</text>
  <text x="56" y="219" font-size="11.5" fill="#475569">Normalize every channel to one internal event schema · voice ↔ streaming ASR/TTS · SMS/chat text-native</text>

  <line x1="600" y1="230" x2="600" y2="254" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="246" font-size="10.5" fill="#64748b">one event schema</text>

  <!-- ===================== ORCHESTRATION CORE ===================== -->
  <rect x="40" y="254" width="1120" height="156" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="56" y="278" font-size="13.5" font-weight="700" fill="#0f172a">Orchestration core — channel-agnostic, safety-gated</text>

  <rect x="56" y="290" width="168" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="68" y="316" font-size="12.5" font-weight="700" fill="#0f172a">Identity &amp; consent</text>
  <text x="68" y="338" font-size="10.5" fill="#475569">Risk-tiered verify</text>
  <text x="68" y="355" font-size="10.5" fill="#475569">Proxy / authorization</text>
  <text x="68" y="372" font-size="10.5" fill="#475569">Consent capture</text>

  <rect x="237" y="290" width="168" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="249" y="316" font-size="12.5" font-weight="700" fill="#0f172a">Language (turn 1)</text>
  <text x="249" y="338" font-size="10.5" fill="#475569">Native EN/ES (not MT)</text>
  <text x="249" y="355" font-size="10.5" fill="#475569">Interpreter bridge</text>
  <text x="249" y="372" font-size="10.5" fill="#475569">for clinical / PHI</text>

  <rect x="418" y="290" width="168" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="430" y="316" font-size="12.5" font-weight="700" fill="#0f172a">Intent classifier</text>
  <text x="430" y="338" font-size="10.5" fill="#475569">Admin vs clinical</text>
  <text x="430" y="355" font-size="10.5" fill="#475569">Confidence score</text>
  <text x="430" y="372" font-size="10.5" fill="#475569">→ human if low</text>

  <rect x="599" y="290" width="168" height="104" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="611" y="316" font-size="12.5" font-weight="700" fill="#991b1b">Policy &amp; guardrails</text>
  <text x="611" y="338" font-size="10.5" fill="#7f1d1d">PHI gate (identity)</text>
  <text x="611" y="355" font-size="10.5" fill="#7f1d1d">Clinical gate</text>
  <text x="611" y="372" font-size="10.5" fill="#7f1d1d">Red-flag detector · per turn</text>

  <rect x="780" y="290" width="168" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="792" y="316" font-size="12.5" font-weight="700" fill="#0f172a">Conversation state</text>
  <text x="792" y="338" font-size="10.5" fill="#475569">Multi-turn context</text>
  <text x="792" y="355" font-size="10.5" fill="#475569">Channel continuity</text>
  <text x="792" y="372" font-size="10.5" fill="#475569">Task tracking</text>

  <rect x="961" y="290" width="168" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="973" y="316" font-size="12.5" font-weight="700" fill="#0f172a">Audit log</text>
  <text x="973" y="338" font-size="10.5" fill="#475569">Every turn logged</text>
  <text x="973" y="355" font-size="10.5" fill="#475569">Action + disposition</text>
  <text x="973" y="372" font-size="10.5" fill="#475569">QA sampling</text>

  <!-- core -> tools -->
  <line x1="650" y1="410" x2="650" y2="440" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="429" font-size="10.5" fill="#64748b">policy-approved actions</text>
  <!-- tools -> core -->
  <line x1="520" y1="440" x2="520" y2="410" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="429" font-size="10.5" fill="#64748b">results / data</text>

  <!-- ===================== TOOLS ===================== -->
  <rect x="40" y="440" width="1120" height="150" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="56" y="464" font-size="13.5" font-weight="700" fill="#065f46">Tool &amp; integration layer</text>

  <rect x="56" y="476" width="300" height="100" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.3"/>
  <text x="68" y="502" font-size="12.5" font-weight="700" fill="#065f46">Epic (system of record)</text>
  <text x="68" y="524" font-size="10.5" fill="#047857">FHIR · Cadence scheduling</text>
  <text x="68" y="541" font-size="10.5" fill="#047857">Med list · refill protocol</text>
  <text x="68" y="558" font-size="10.5" fill="#047857">Results · tasks (Redox if needed)</text>

  <rect x="368" y="476" width="180" height="100" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.3"/>
  <text x="380" y="502" font-size="12.5" font-weight="700" fill="#065f46">LLM — talks only</text>
  <text x="380" y="524" font-size="10.5" fill="#047857">HIPAA-eligible</text>
  <text x="380" y="541" font-size="10.5" fill="#047857">under BAA</text>
  <text x="380" y="558" font-size="10.5" fill="#047857">no PHI training</text>

  <rect x="560" y="476" width="170" height="100" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.3"/>
  <text x="572" y="502" font-size="12.5" font-weight="700" fill="#065f46">Eligibility</text>
  <text x="572" y="524" font-size="10.5" fill="#047857">270/271 via</text>
  <text x="572" y="541" font-size="10.5" fill="#047857">clearinghouse</text>
  <text x="572" y="558" font-size="10.5" fill="#047857">(Availity/Change)</text>

  <rect x="742" y="476" width="170" height="100" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.3"/>
  <text x="754" y="502" font-size="12.5" font-weight="700" fill="#065f46">Prior auth</text>
  <text x="754" y="524" font-size="10.5" fill="#047857">status lookup</text>
  <text x="754" y="541" font-size="10.5" fill="#047857">Epic copy; payer = truth</text>
  <text x="754" y="558" font-size="10.5" fill="#047857">stall detection</text>

  <rect x="924" y="476" width="220" height="100" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.3"/>
  <text x="936" y="502" font-size="12.5" font-weight="700" fill="#065f46">Scheduling &amp; tasks</text>
  <text x="936" y="524" font-size="10.5" fill="#047857">Book / move / cancel</text>
  <text x="936" y="541" font-size="10.5" fill="#047857">Provider &amp; coordinator</text>
  <text x="936" y="558" font-size="10.5" fill="#047857">queues · outbound calls</text>

  <!-- ===================== ESCALATION ARROW (left margin) ===================== -->
  <path d="M40 360 L22 360 L22 700 L70 700" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="28" y="470" font-size="11" font-weight="700" fill="#dc2626" transform="rotate(-90 28 470)" text-anchor="middle">escalate: red flags · unverified caller · low confidence</text>

  <!-- ===================== HUMAN LAYER ===================== -->
  <rect x="40" y="620" width="1120" height="130" rx="12" fill="#fff7f7" stroke="#ef4444" stroke-width="2"/>
  <text x="56" y="644" font-size="13" font-weight="700" fill="#991b1b">Human layer — escalation &amp; handoff · state-matched licensure (AZ/NM compact; NV single-state) · warm transfer + draft approval</text>

  <rect x="70" y="656" width="250" height="82" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
  <text x="82" y="682" font-size="12.5" font-weight="700" fill="#991b1b">Front desk / registration</text>
  <text x="82" y="704" font-size="10.5" fill="#7f1d1d">Insurance updates, new patients</text>
  <text x="82" y="721" font-size="10.5" fill="#7f1d1d">Records &amp; proxy setup</text>

  <rect x="340" y="656" width="250" height="82" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
  <text x="352" y="682" font-size="12.5" font-weight="700" fill="#991b1b">Nurse triage line</text>
  <text x="352" y="704" font-size="10.5" fill="#7f1d1d">After-hours clinical</text>
  <text x="352" y="721" font-size="10.5" fill="#7f1d1d">Runs licensed triage protocols</text>

  <rect x="610" y="656" width="250" height="82" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
  <text x="622" y="682" font-size="12.5" font-weight="700" fill="#991b1b">On-call clinician</text>
  <text x="622" y="704" font-size="10.5" fill="#7f1d1d">Structured summary handoff</text>
  <text x="622" y="721" font-size="10.5" fill="#7f1d1d">Refill / PA decisions</text>

  <rect x="880" y="656" width="250" height="82" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.3"/>
  <text x="892" y="682" font-size="12.5" font-weight="700" fill="#991b1b">911 / ED guidance</text>
  <text x="892" y="704" font-size="10.5" fill="#7f1d1d">Emergency default when</text>
  <text x="892" y="721" font-size="10.5" fill="#7f1d1d">no clinician answers</text>

  <!-- ===================== CROSS-CUTTING ===================== -->
  <rect x="40" y="780" width="1120" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="56" y="806" font-size="12.5" font-weight="700" fill="#92400e">Cross-cutting: BAA with every subprocessor · no audio retention · no PHI in training · encryption in transit &amp; at rest · RBAC · full audit + QA</text>
  <text x="56" y="828" font-size="11" fill="#a16207">Privacy officer's answer: audio streamed to a BAA ASR for transcription, then discarded; stored only with consent and a short retention window.</text>

  <!-- Legend -->
  <line x1="40" y1="870" x2="72" y2="870" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="80" y="874" font-size="10.5" fill="#64748b">data / action</text>
  <line x1="200" y1="870" x2="232" y2="870" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="240" y="874" font-size="10.5" fill="#64748b">human escalation (clinical risk / unverified / low confidence)</text>

  <!-- markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
